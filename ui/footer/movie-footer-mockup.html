<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Footer Mockup - Full</title>
  <link rel="stylesheet" href="styles.css" />
  </head>
<body>
  <div class="screen">
    <header class="app-header">
      <div class="logo">PHIMHAY OK</div>
      <div class="search">Tìm kiếm</div>
    </header>

    <div class="nav-tabs">
      <button class="tab">Trang Chủ</button>
      <button class="tab">Phim bộ</button>
      <button class="tab">Phim Lẻ</button>
      <button class="tab">Phim Ngắn</button>
      <button class="tab">Phim Mới</button>
    </div>

    <main class="content">
      <section class="hero">
        <img src="https://via.placeholder.com/800x450?text=Poster" alt="poster" class="hero-img" />
        <div class="hero-overlay">
          <h1 class="movie-title">Luật Sư Gian Ác</h1>
          <div class="meta"><span class="badge">TOP 6</span><span class="year">2026 · Thái Lan</span></div>
        </div>
      </section>

      <section class="movie-list">
        <h2>Phim Mới</h2>
        <div class="cards">
          <div class="card">
            <img src="https://via.placeholder.com/160x240?text=Film" alt="film" />
            <button class="play">▶</button>
            <div class="card-title">Ác Niệm</div>
          </div>
          <div class="card">
            <img src="https://via.placeholder.com/160x240?text=Film" alt="film" />
            <button class="play">▶</button>
            <div class="card-title">Phi Thăng Giữa B..</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="movie-footer" role="region" aria-label="Music controller">
      <div class="footer-left">
        <img src="https://via.placeholder.com/120x180?text=Poster" alt="poster" class="thumb" />
        <div class="info">
          <div class="title">Ác Niệm</div>
          <div class="sub">Vietsub · 12 tập</div>
          <div class="progress-wrap">
            <div class="progress">
              <div class="progress-bar" style="width:18%"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer-center">
        <button class="icon-small prev" aria-label="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 18V6l-8 6 8 6zM13 6v12l8-6-8-6z" fill="currentColor"/></svg>
        </button>
        <button class="play-large" aria-label="Play">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="#07100b"/></svg>
          <span>Phát</span>
        </button>
        <button class="icon-small next" aria-label="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 6v12l8-6-8-6zM13 6v12l8-6-8-6z" fill="currentColor"/></svg>
        </button>
      </div>

      <div class="footer-right">
        <button class="icon" aria-label="Add to list"> 
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon" aria-label="Share">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 6l-4-4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </footer>
    <div class="footer-handle" aria-hidden="true"></div>
  </div>
</body>
</html>
