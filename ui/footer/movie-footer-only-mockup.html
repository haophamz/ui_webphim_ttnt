<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Footer Mockup - Footer Only</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* small tweaks specific to this page */
    body{background:#070707}
    .screen{max-width:420px;margin:0 auto;height:100vh;border-radius:0}
    .app-header,.nav-tabs,.hero{display:none}
    .content{padding:20px 14px 160px}
    .movie-list h2{color:#fff;margin-bottom:12px}
    .cards{gap:12px}
    .card{width:120px}
    .card img{height:170px;object-fit:cover}
    /* make footer wider and overlay like mobile app */
    .movie-footer{left:50%;transform:translateX(-50%);bottom:18px;width:360px;height:78px}
    .footer-handle{bottom:106px}
  </style>
</head>
<body>
  <div class="screen">
    <main class="content">
      <section class="movie-list">
        <h2>Phim Mới</h2>
        <div class="cards">
          <div class="card">
            <img src="https://via.placeholder.com/240x340?text=Phim+1" alt="film1" />
            <div class="card-title">Dịch Nhân Kiệt</div>
          </div>
          <div class="card">
            <img src="https://via.placeholder.com/240x340?text=Phim+2" alt="film2" />
            <div class="card-title">Ác Niệm</div>
          </div>
          <div class="card">
            <img src="https://via.placeholder.com/240x340?text=Phim+3" alt="film3" />
            <div class="card-title">Phi Thăng Giữa B..</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="movie-footer" role="region" aria-label="Movie Footer">
      <div class="footer-left">
        <img src="https://via.placeholder.com/120x180?text=Poster" alt="poster" class="thumb" />
        <div class="info">
          <div class="title">Ác Niệm</div>
          <div class="sub">Vietsub · 12 tập</div>
          <div class="progress-wrap">
            <div class="progress"><div class="progress-bar" style="width:24%"></div></div>
          </div>
        </div>
      </div>

      <div class="footer-center">
        <button class="icon-small prev" aria-label="Previous">‹</button>
        <button class="play-large" aria-label="Play"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="#07100b"/></svg><span>Phát</span></button>
        <button class="icon-small next" aria-label="Next">›</button>
      </div>

      <div class="footer-right">
        <button class="icon" aria-label="Add">＋</button>
        <button class="icon" aria-label="Share">⤴</button>
      </div>
    </footer>
    <div class="footer-handle" aria-hidden="true"></div>
  </div>
</body>
</html>
