<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - PhimHayOK</title>

    <link rel="stylesheet" href="forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <img src="https://images.unsplash.com/photo-1489599849927-8d4f0c3b5b6f?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80"
    class="movie-poster poster1">

    <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80"
    class="movie-poster poster2">

    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80"
    class="movie-poster poster3">

    <div class="film-grain"></div>

    <div class="auth-wrapper">

        <div class="logo">
            <img src="https://via.placeholder.com/80x80/22d3ee/111?text=🎥">
            <h1>PhimHayOK</h1>
        </div>

        <h2>Khôi Phục Mật Khẩu</h2>

        <p class="instruction-text">
            Vui lòng nhập email đã đăng ký để nhận liên kết khôi phục mật khẩu.
        </p>

        <form id="forgotForm">

            <div class="input-group">
                <input type="email" id="email" placeholder="Nhập Email của bạn" required>
                <i class="fas fa-envelope"></i>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i>
                GỬI LIÊN KẾT KHÔI PHỤC
            </button>

        </form>

        <a href="login.html" class="back-to-login">
            <i class="fas fa-arrow-left"></i>
            Quay lại đăng nhập
        </a>

    </div>

    <script src="forgot-password.js"></script>

</body>
</html>
