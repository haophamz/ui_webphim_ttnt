<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 1 – Tập 1 – PhimHay</title>
  <meta name="description" content="Xem Demo 1 tập 1 vietsub HD">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── NAVBAR ── -->
  <nav class="navbar" id="main-navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">PHIM<span>HAY</span></a>
      <div class="nav-links">
        <a href="index.html">Trang Chủ</a>
        <a href="#">Quốc Gia</a>
        <a href="#">Thể Loại</a>
        <a href="#">Năm</a>
      </div>
      <form class="nav-search" action="#" method="get">
        <input type="text" name="q" placeholder="Tìm kiếm phim..." id="search-input">
        <button type="submit" aria-label="Tìm kiếm">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"
                  stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </div>
  </nav>

  <!-- ── MAIN CONTENT ── -->
  <div class="watch-page">
    <div class="container">

      <!-- Breadcrumb -->
      <div class="watch-top-bar">
        <a href="index.html">Trang chủ</a>
        <span class="sep">/</span>
        <a href="movie_detail.html">Demo 1</a>
        <span class="sep">/</span>
        <span class="current">Tập 1</span>
      </div>

      <div class="watch-layout">

        <!-- ── CỘT TRÁI: Player + Controls ── -->
        <div class="player-section">

          <!-- Video Player -->
          <div class="player-wrap" style="display: flex; align-items: center; justify-content: center; background: #000; color: #555;">
            <!-- Dummy Video box (No backend data/src) -->
            <div style="text-align: center;">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" style="opacity: 0.3; margin-bottom: 10px;">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <br><span>Khung Video Player</span>
            </div>
          </div>

          <!-- Info bar -->
          <div class="player-info-bar">
            <div class="now-playing">
              <span class="dot-live"></span>
              Đang phát:&nbsp;<strong>Demo 1 - Tập 1</strong>
            </div>

            <!-- Chuyển tập -->
            <div class="nav-controls">
              <span class="nav-btn disabled">
                <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
                Tập trước
              </span>

              <span class="current-ep-pill">TẬP 1</span>

              <a class="nav-btn" href="watch.html" id="btn-next-ep">
                Tập 2
                <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
              </a>
            </div>
          </div>

        </div><!-- /player-section -->

        <!-- ── CỘT PHẢI: Sidebar danh sách tập ── -->
        <aside class="sidebar-section" id="episode-sidebar">
          <div class="sidebar-header">
            <h3>Danh sách tập</h3>
            <div class="ep-tab">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z" fill="#111"/></svg>
              Vietsub
            </div>
          </div>

          <div class="sidebar-episode-list" id="sidebar-ep-list">
            <a class="sidebar-ep-btn is-current" href="watch.html" id="sidebar-ep-1" title="Demo 1 - Tập 1">1</a>
            <a class="sidebar-ep-btn" href="watch.html" id="sidebar-ep-2" title="Demo 1 - Tập 2">2</a>
            <a class="sidebar-ep-btn" href="watch.html" id="sidebar-ep-3" title="Demo 1 - Tập 3">3</a>
            <a class="sidebar-ep-btn" href="watch.html" id="sidebar-ep-4" title="Demo 1 - Tập 4">4</a>
            <a class="sidebar-ep-btn" href="watch.html" id="sidebar-ep-5" title="Demo 1 - Tập 5">5</a>
            <a class="sidebar-ep-btn" href="watch.html" id="sidebar-ep-6" title="Demo 1 - Tập 6">6</a>
          </div>
        </aside>

      </div><!-- /watch-layout -->
    </div><!-- /container -->
  </div><!-- /watch-page -->

  <!-- ── FOOTER ── -->
  <footer class="site-footer">
    <p>© 2024 <span>PhimHay</span> – N4 Episodes Module &nbsp;|&nbsp; Nhóm Học Máy</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
