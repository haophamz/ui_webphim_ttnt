<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - PhimHayOK</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <img src="https://images.unsplash.com/photo-1489599849927-8d4f0c3b5b6f?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80"
         class="movie-poster poster1">

    <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80"
         class="movie-poster poster2">

    <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80"
         class="movie-poster poster3">

    <div class="film-grain"></div>

    <div class="login-wrapper">
        <div class="logo">
            <img src="https://via.placeholder.com/85x85/22d3ee/111?text=🎥">
            <h1>PhimHayOK</h1>
        </div>

        <h2>Đăng Nhập</h2>

        <form id="loginForm">

            <div class="input-group">
                <input type="email" id="email" placeholder="Email của bạn" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu" required>
                <i class="fas fa-lock"></i>

                <span class="toggle-password" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <a href="forgot-password.html" class="forgot-pass">Quên mật khẩu?</a>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i>
                ĐĂNG NHẬP
            </button>

        </form>

        <div class="register-section">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>

    <script src="login.js"></script>

</body>
</html>
